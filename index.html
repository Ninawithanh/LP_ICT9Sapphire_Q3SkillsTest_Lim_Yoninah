        body {
            background-color: rgb(58, 31, 71);

        }

            background-color: rgb(139, 72, 171);
            border-radius: 15px;
            margin-left: 10px;
            margin-right: 10px;
            margin-top: 20px;
            margin-bottom: 20px;
            padding: 30px 25px;
            text-align: center;
            font-family: Gill Sans MT;
        }
    </style>

</head>

    <nav class="navbar navbar-expand-sm navbar-light bg-light"> 
        <div class="container-fluid"> 
            <a class="navbar-brand" href="#fyp"> <img src="logo.png" alt="logo" height="50px"> </a>

            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#mynavbar">
                <span class="navbar-toggler-icon"> </span>
            </button>

            <div class="collapse navbar-collapse" id="mynavbar">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">

                    <li class="nav-item">

                    <li class="nav-item">

                    </li>

                    </li>
                </ul>

                <form class="d-flex">
                    <input class="form-control me-2" type="text" placeholder="Search...">

                </form>
            </div>

    <div class="yay"> 

        <br>
        <h2 class="fw-bold"> REGISTRATION </h2>
        
        <br>
        <br>
        <h3 class="fw-bold"> Student Information </h3>
        <div class="container mt-3">
            <form>
                <div class="row"> 
                    <div class="col">
                        <label for="name1"> First Name </label>
                        <input type="name1" class="form-control" id="name1" placeholder="John" name="name">
                    </div>

                    <div class="col"> 
                        <label for="name2"> Last Name </label>
                        <input type="name2" class="form-control" id="name2" placeholder="Mantle" name="name">
                    </div>

                </div>
                <br>

                <div class="row"> 
                    <div class="col">
                        <label for="bday"> Birth Date </label>
                        <input type="date" class="form-control" id="bday" placeholder="John" name="bday">
                    </div>
                    <div class="col"> 
                        <label for="sel1" class="form-label"> Gender </label>
                            <select class="form-select" id="sel1" name="sellist1">
                                <option> Female </option>
                                <option> Male </option>
                                <option> Nonbinary </option>
                                <option> Others </option>
                            </select>
                    </div>
                    <div class="col"> 
                        <label for="contact"> Contact Number </label>
                    <input type="contact" class="form-control" id="contact" placeholder="0912-345-6789" name="subject">
                    </div>
                </div>

                <div class="container mt-3">
                    <div class="mb-3 mt-3"> 
                    <label for="email"> Email Address </label>
                    <input type="email" class="form-control" id="email" placeholder="john_mantle@gmail.com" name="email">
                </div>
                <div class="container mt-3">
                    <div class="mb-3 mt-3"> 
                    <label for="user"> Username </label>
                    <input type="user" class="form-control" id="user" placeholder="Banana_81362" name="user">
                </div>
                <div class="container mt-3">
                    <div class="mb-3 mt-3"> 
                    <label for="password"> Password </label>
                    <input type="password" class="form-control" id="password" placeholder="Type Here..." name="password">
                </div>
        
                <br>
                <div class="form-check" style="text-align: left;">
                    <input type="checkbox" class="form-check-input" id="check1" name="option1" value="checked">
                    <label class="form-check-label" for="check1"> I confirm that the information I provided is true and complete. </label>
                </div>

                <br>
                <label for="myfile"> </label>
                <input type="file" id="myfile" name="myfile">
                <img src="pfp.png" alt="pfp" height="100px" width="100px">
                <br>

                <br>
                
                <br>

            </form>

            <button type="submit" id="toggleButton" class="btn btn-secondary" onclick="showAlert()">Create the Account</button>
                <script>
                    function showAlert() {
                        alert("Thank you for registering!")};
                </script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
